server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # gzip — 텍스트 자산 압축
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # .jsx 파일을 자바스크립트로 서빙 (Babel이 text/babel 로 읽지만 명시해 둠)
    location ~* \.jsx$ {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    # data.js 등 동적 데이터성 스크립트는 캐시 비활성
    location ~* /(data|api|app|grid|detail|components)\.js$ {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    # /api/* 와 /ingest/* 는 Collector(수집기)로 프록시.
    # 변수+resolver를 써서 collector 컨테이너가 없어도 nginx가 기동되게 함
    # (없으면 502 → 대시보드가 자동으로 목업으로 폴백).
    location ~ ^/(api|ingest)/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $collector_host "collector";
        proxy_pass http://$collector_host:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
